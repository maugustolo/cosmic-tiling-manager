<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Outer Rim (COSMIC Style Gray Bezel) -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#A5ADBA" />
  
  <!-- Inner Background (Dark Navy) -->
  <rect x="14" y="14" width="100" height="100" rx="18" fill="#1C2534" />
  
  <!-- Tiled Window 1 (Left) -->
  <rect x="24" y="24" width="36" height="80" rx="6" fill="#34425A" />
  
  <!-- Tiled Window 2 (Top Right) -->
  <rect x="68" y="24" width="36" height="36" rx="6" fill="#34425A" />
  
  <!-- Tiled Window 3 (Bottom Right) -->
  <rect x="68" y="68" width="36" height="36" rx="6" fill="#34425A" />
  
  <!-- Floating Window Drop Shadow -->
  <rect x="54" y="48" width="56" height="40" rx="6" fill="#000000" opacity="0.4" />
  
  <!-- Floating Window Base (Teal) -->
