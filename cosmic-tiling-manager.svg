  <!-- Floating Window Titlebar (Darker Teal) -->
  <path d="M 50 50 Q 50 44 56 44 L 100 44 Q 106 44 106 50 L 106 54 L 50 54 Z" fill="#2A9CA9" />
  
  <!-- Window Controls (Small Dots on Titlebar) -->
  <circle cx="56" cy="49" r="2.5" fill="#1C2534" opacity="0.5" />
  <circle cx="64" cy="49" r="2.5" fill="#1C2534" opacity="0.5" />
